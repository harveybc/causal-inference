[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-inference-m5phet"
version = "0.1.0"
description = "Explicit, offline causal ATE provider backed by EconML"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
fit = [
    "econml==0.16.0",
    "numpy>=1.26,<2.3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<1.7",
    "scipy>=1.11,<1.16",
    "threadpoolctl>=3.1,<4",
]

test = ["pytest>=8,<9"]

[project.entry-points."m5phet.providers"]
causal_inference = "causal_inference_provider.chat:M5PHETCausalProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
